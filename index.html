<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kora Primeros Auxilios</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- SDK universal de sincronización Kora -->
  <script src="https://cdn.jsdelivr.net/gh/KoraDevsOrg/kora-web-sdk@main/kora-sync.js"></script>
</head>
<body>

  <div id="beaconScreenFlash" style="position: fixed; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; transition: opacity 0.05s linear; z-index: 100;"></div>
  
  <!-- Backdrop accesible del Drawer -->
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <!-- Menú Hamburguesa Lateral -->
  <aside id="sideDrawer" class="side-drawer">
    
    <div style="background: #1e293b; border: 2px solid #ef4444; border-radius: 12px; padding: 16px; margin-bottom: 16px; text-align: center;">
  <button id="btnBeacon" style="background: #ef4444; color: white; border: none; width: 80px; height: 80px; border-radius: 50%; font-size: 2rem; cursor: pointer; box-shadow: 0 0 20px rgba(239,68,68,0.4);">
    🚨
  </button>
  <h3 id="beaconTitle" style="font-size: 1rem; margin-top: 10px;">Baliza Desactivada</h3>
  <p id="beaconDesc" style="color: #94a3b8; font-size: 0.8rem; margin-top: 4px;">Toca para alternar: Eco (Nivel 1) → Medio (Nivel 2) → Rápido (Nivel 3)</p>
</div>

    <div class="drawer-header">
      <h2 id="drawerTitle" style="font-size: 1.1rem; font-weight: 800;">Protocolos</h2>
      <button id="btnCloseDrawer" class="btn-hamburger">✕</button>
    </div>
    <nav id="drawerList" class="drawer-list"></nav>
    <div class="drawer-footer">
      <label for="langSelect" style="font-size: 0.8rem; color: var(--text-sub); display: block; margin-bottom: 6px;">Idioma / Yuwe:</label>
      <select id="langSelect" class="lang-select">
        <option value="es">Español</option>
        <option value="guc">Wayuunaiki</option>
        <option value="pbb">Nasa Yuwe</option>
      </select>
    </div>
  </aside>

  <!-- Encabezado Principal -->
  <header>
    <div class="header-left">
      <button id="btnOpenDrawer" class="btn-hamburger" aria-label="Abrir menú">☰</button>
      <h1 id="appTitle">Kora Primeros Auxilios</h1>
    </div>
    <div id="offlineBadge" class="offline-badge">100% Offline</div>
  </header>

  <!-- Contenedor Principal de Protocolos y Metrónomo -->
  <main>
    <div id="metronomeContainer" style="display: none;"></div>
    <div id="mainContent"></div>
  </main>

  <footer>
    <span id="footerText">Kora Health Initiative • Software Libre MIT</span>
  </footer>

  <!-- Script modular de la aplicación -->
  <script type="module" src="js/app.js" version="1.0.1"></script>
</body>
</html>
